services:
  activities-service:
    image: activities-service:latest
    restart: on-failure
    depends_on:
      - redis
    ports:
      - "19080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Host WireMock (not Compose). From inside Docker, localhost = container.
      ACTIVITY_BASE_URL: http://host.docker.internal:3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:alpine
